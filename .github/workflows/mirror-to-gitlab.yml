name: mirror-to-gitlab.yml
on: [push, delete]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ glpat-NRtmP-SU-BjYmVMg-yGEZ2M6MQpvOjEKdTpwcDR1bQ8.01.170hb5n5w }}
        run: |
          git remote add gitlab https://oauth2:$GITLAB_TOKEN@gitlab.com/your-username/your-repo.git
          git push --mirror gitlab