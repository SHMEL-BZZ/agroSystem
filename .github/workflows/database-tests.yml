name: Database CI

on:
  push:
  pull_request:

jobs:
  db-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: watering
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d watering"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD_SUPER: postgres
      PGPASSWORD_APP: AppPassword123!
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: watering
      DB_USERNAME: app_user
      DB_PASSWORD: AppPassword123!

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Init roles and extensions
        run: |
          psql -h "$DB_HOST" -U postgres -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN
              CREATE ROLE app_user LOGIN PASSWORD 'AppPassword123!';
            END IF;
          END$$;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          GRANT CONNECT ON DATABASE watering TO app_user;
          GRANT USAGE ON SCHEMA public TO app_user;
          SQL
        env:
          PGPASSWORD: ${{ env.PGPASSWORD_SUPER }}

      - name: Apply schema
        run: psql -h "$DB_HOST" -U app_user -d "$DB_NAME" -v ON_ERROR_STOP=1 -f database/schema.sql
        env:
          PGPASSWORD: ${{ env.PGPASSWORD_APP }}

      - name: Load test data
        run: psql -h "$DB_HOST" -U app_user -d "$DB_NAME" -v ON_ERROR_STOP=1 -f database/test-data.sql
        env:
          PGPASSWORD: ${{ env.PGPASSWORD_APP }}

      - name: Run SQL tests
        run: psql -h "$DB_HOST" -U app_user -d "$DB_NAME" -v ON_ERROR_STOP=1 -f database/tests.sql
        env:
          PGPASSWORD: ${{ env.PGPASSWORD_APP }}