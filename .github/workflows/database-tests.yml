name: Database CI

on:
  push:
    branches: [main, back_margo]
  pull_request:
    branches: [main]

jobs:
  test-database:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watering
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Установка PostgreSQL клиента
        run: sudo apt-get install -y postgresql-client

      - name: Создание роли app_user и расширения pgcrypto
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d watering -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN
                CREATE ROLE app_user LOGIN PASSWORD 'app_pass';
              END IF;
            END \$\$;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
          "

      - name: Применение схемы (от app_user)
        env:
          PGPASSWORD: app_pass
        run: |
          psql -h localhost -U app_user -d watering -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Загрузка тестовых данных
        env:
          PGPASSWORD: app_pass
        run: |
          psql -h localhost -U app_user -d watering -v ON_ERROR_STOP=1 -f database/test-data.sql

      - name: Запуск SQL-тестов
        env:
          PGPASSWORD: app_pass
        run: |
          psql -h localhost -U app_user -d watering -v ON_ERROR_STOP=1 -f database/tests.sql

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей
        run: npm ci

      - name: Запуск Jest-тестов
        run: npx jest test/test-registration.js --runInBand