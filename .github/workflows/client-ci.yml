name: Client CI

on:
  push:
    branches: [ client ]
  pull_request:
    branches: [ client ]


jobs:
  test-client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      # 1. ��������� ����������� � runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. ������������� Node.js 20 � �������� ��� npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/src/package-lock.json'

      # 3. ������������� ����������� �� package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. ��������� �����
      - name: Run tests
        run: npm test -- --watchAll=false --coverage