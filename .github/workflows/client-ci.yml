name: Client CI

on:
  push:
    branches: [ client ]
  pull_request:
    branches: [ client ]

jobs:
  test-client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # ОТЛАДОЧНЫЙ ШАГ
      - name: Debug - Check files
        run: |
          echo "Текущая директория:"
          pwd
          echo "Файлы в текущей директории:"
          ls -la
          echo "Поиск package-lock.json во всем репозитории:"
          find . -name package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --watchAll=false --coverage